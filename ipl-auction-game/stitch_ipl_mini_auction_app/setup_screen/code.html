<script>
        // Micro-interaction for slider feedback
        const slider = document.querySelector('input[type="range"]');
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            const min = e.target.min ? e.target.min : 0;
            const max = e.target.max ? e.target.max : 100;
            const newVal = Number(((val - min) * 100) / (max - min));
            
            // Pulsate value on change
            const valDisplay = document.getElementById('budgetValue');
            valDisplay.classList.add('scale-110');
            setTimeout(() => valDisplay.classList.remove('scale-110'), 100);
        });

        // Toggle logic for team buttons
        const teamBtns = document.querySelectorAll('button.flex-1');
        teamBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                teamBtns.forEach(b => {
                    b.classList.remove('gold-gradient', 'text-inverse-on-surface', 'gold-glow', 'inner-glow-gold', 'transform', 'scale-105');
                    b.classList.add('border', 'border-white/10', 'text-on-surface-variant/60');
                });
                btn.classList.add('gold-gradient', 'text-inverse-on-surface', 'gold-glow', 'inner-glow-gold', 'transform', 'scale-105');
                btn.classList.remove('border', 'border-white/10', 'text-on-surface-variant/60');
            });
        });
    </script>
