<script>
        // Atmospheric Mouse Follower
        const glow = document.getElementById('glow-follow');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            // Smoothed movement
            requestAnimationFrame(() => {
                glow.style.transform = `translate(${x - 192}px, ${y - 192}px)`;
            });
        });

        // Simple button interaction
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                glow.style.backgroundColor = 'rgba(233, 196, 0, 0.1)';
            });
            btn.addEventListener('mouseleave', () => {
                glow.style.backgroundColor = 'rgba(209, 191, 235, 0.05)';
            });
        });
    </script>
